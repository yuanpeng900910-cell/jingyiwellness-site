<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京颐养方品牌产品购买Q&A手册</title>
  <meta name="description" content="京颐养方销售人员内部参考的品牌、产品与销售合规Q&A资料页。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sales-qa.css">
</head>
<body class="sales-qa-page">
  <main class="sales-qa-main">
    <header class="sales-qa-header">
      <p class="eyebrow">INTERNAL SALES PAGE</p>
      <h1>京颐养方品牌产品购买Q&A手册</h1>
      <p>销售内部参考（隐藏页）：用于品牌介绍、产品问答、购买团购与合规表达。</p>
    </header>

    <section class="sales-qa-tools" aria-label="Q&A筛选工具">
      <label class="sales-qa-search" for="qaSearchInput">
        <span>搜索问题/关键词</span>
        <input id="qaSearchInput" type="search" placeholder="例如：团购、鼻安梦香枕、体质、合规话术">
      </label>
      <div class="sales-qa-categories" id="qaCategoryFilters" aria-label="分类筛选"></div>
    </section>

    <section class="sales-qa-list" id="qaList" aria-live="polite"></section>
    <p class="sales-qa-empty" id="qaEmpty" hidden>暂无匹配内容，请尝试其他关键词或分类。</p>
  </main>

  <script src="js/sales-qa.js"></script>
</body>
</html>
