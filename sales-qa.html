<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>京颐养方销售Q&A</title>
  <meta name="description" content="京颐养方销售快速检索平台，用于现场答疑、团购沟通、异议处理与合规表达。">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/sales-qa.css">
</head>
<body class="sales-qa-page">
  <main class="sales-qa-main" id="top">
    <header class="hero">
      <p class="hero-kicker">销售工作台</p>
      <h1 id="pageTitle"></h1>
      <p class="hero-subtitle" id="pageSubtitle"></p>
      <p class="hero-intro" id="pageIntro"></p>
    </header>

    <section class="search-panel">
      <input id="qaSearchInput" type="search">
      <p id="qaResultCount" class="result-count"></p>
    </section>

    <section id="quickEntrances" class="quick-entrances" aria-label="快捷入口"></section>
    <section class="quick-guide" id="quickGuide"></section>
    <section class="category-bar" id="qaCategoryFilters"></section>
    <section id="qaContent" class="qa-content"></section>
    <p class="sales-qa-empty" id="qaEmpty" hidden>没有找到相关内容，可尝试搜索：怎么选、团购、孕妇、煮泡、智商税、合香珠、隐茶杯</p>
  </main>
  <a href="#top" class="back-top">回到顶部</a>

  <script src="js/data/sales-qa-data.js"></script>
  <script src="js/sales-qa.js"></script>
</body>
</html>
